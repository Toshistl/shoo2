    <!DOCTYPE html>
    <html lang="mn">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title></title>
        <style>
            body {
                font-family: 'Times New Roman', Times, serif;
                text-align: center;
                margin: 20px;
                margin: auto;
                background-color: #f4f4f9;
                width: 100%;
                max-width: 700px;
                box-sizing: border-box;
                padding-right: 20px;
                padding-left: 20px
            }

            .container {
                display: flex;
                flex-wrap: nowrap;
                justify-content: center;
                gap: 20px;
                margin-top: 20px;
            }
            .hairtsag {
                border: 2px solid blue;
                padding: 10px;
                border-radius: 10px;
                flex: 1;
                width: 200px;
                background-color: white;
                box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            }

            button {
                padding: 10px 20px;
                font-size: 16px;
                background-color: blue;
                color: white;
                border: none;
                border-radius: 5px;
                margin-top: 10px;
            }
            button:disabled {
                background-color: gray;
            }
            button:hover:not(:disabled) {
                background-color: rgb(0, 0, 120);
            }
            .urdun {
                margin-top: 30px;
                font-size: 24px;
                font-weight: bold;
                color: green;
            }
        </style>
    </head>
    <body>
        <h1>Шоо хаях тоглоом</h1>
        <h2><div class="urdun" id="dun"></div></h2>
        <img src="dice1.png" id="zurag" width="250px"/>

        <div class="container">
            <div class="hairtsag">
                <h3>1-р тоглогч</h3>
                <p>Оноо: <span id="niilber1">0</span></p>
                <p>Хаясан: <span id="udaa1">0</span>/3</p>
                <button id="tovch1" onclick="hayh1()">Шоо хаях</button>
            </div>
            <div class="hairtsag">
                <h3>2-р тоглогч</h3>
                <p>Оноо: <span id="niilber2">0</span></p>
                <p>Хаясан: <span id="udaa2">0</span>/3</p>
                <button id="tovch2" onclick="hayh2()">Шоо хаях</button>
            </div>
        </div>
        <br>
        <button onclick="shineerEhleh()">Шинээр эхлэх</button>

        <script>
            let count1 = 0;
            let count2 = 0;
            let udaa1 = 0;
            let udaa2 = 0;
            let shoo = document.getElementById("zurag");

            function hayh1() {
                let too = Math.floor(Math.random() * 6) + 1;
                shoo.src = "dice" + too + ".png";
                count1 += too;
                udaa1++;
                document.getElementById("niilber1").innerText = count1;
                document.getElementById("udaa1").innerText = udaa1;
                if (udaa1 == 3) {
                    document.getElementById("tovch1").disabled = true;
                }
                shalgah();
            }

            function hayh2() {
                let too = Math.floor(Math.random() * 6) + 1;
                shoo.src = "dice" + too + ".png";
                count2 += too;
                udaa2++;
                document.getElementById("niilber2").innerText = count2;
                document.getElementById("udaa2").innerText = udaa2;
                if (udaa2 == 3) {
                    document.getElementById("tovch2").disabled = true;
                }
                shalgah();
            }
            function shalgah() {
                if (udaa1 == 3 && udaa2 == 3) {
                    let dun = document.getElementById("dun");
                    if (count1 > count2) {
                        dun.innerText = "1-р тоглогч хожлоо!";
                    } else if (count2 > count1) {
                        dun.innerText = "2-р тоглогч хожлоо!";
                    } else {
                        dun.innerText = "Тэнцлээ!";
                    }
                }
            }

            function shineerEhleh() {
                count1 = 0; count2 = 0;
                udaa1 = 0; udaa2 = 0;
                document.getElementById("niilber1").innerText = 0;
                document.getElementById("niilber2").innerText = 0;
                document.getElementById("udaa1").innerText = 0;
                document.getElementById("udaa2").innerText = 0;
                document.getElementById("dun").innerText = "";
                document.getElementById("tovch1").disabled = false;
                document.getElementById("tovch2").disabled = false;
                shoo.src = "dice1.png";
            }
        </script>
    </body>
    </html>
